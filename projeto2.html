<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing documents with DOM</title>
    <link rel="stylesheet" href="style/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>      

<body>

<!-- SEÇÃO DO CONTADOR DE TAREFAS, FILTROS, ADICIONAR TAREFAS E ORDENAR -->
    <section id="tarefas">
        <section id="title">
            <h1>Task Manager</h1>
        </section>

        <section id="add_tarefa">
            <input type="text" name="addtarefa" id="tarefa" placeholder="Enter your task here">
            <input type="button" value="Add task" onclick="tarefaadicionada()" id="addtarefabtn" >
        </section>

        <section id="filtros">
            Filter by : 
            <button class="filtro ativo" onclick="mudarFiltro('todas')">All</button>
            <button class="filtro"       onclick="mudarFiltro('pendentes')">Pending</button>
            <button class="filtro"       onclick="mudarFiltro('concluidas')">Completed</button>
        </section>

        <section id="ordenacao">
            Sort by :
            <select 
                    name="selectOrdenacao" 
                    id="selectOrdenacao" 
                    onchange="mudarOrdenacao(this.value)">
            <option value="pendentes">Pending</option>
            <option value="concluidas">Completed</option>
            <option value="az">A-Z</option>
            <option value="za">Z-A</option>
            </select>
        </section>

        <section id="lista_tarefas"></section>
            <p id="contador_tarefas">
                Here are your tasks: <br> 
                You currently have no tasks.</p>
        </section>
    </section>
    <footer id="footer">
        <p>© 2026 - Felipe Santana Moraes - <a href="https://github.com/felipemoraesfdev" id="github">github.com/felipemoraesfdev</a></p>
    </footer>

<!-- JAVASCRIPT -->
    <script src="script/script.js"></script>

</body>
</html>
